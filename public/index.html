<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insighta Labs Portal</title>
    <style>
      :root { --bg:#f6f8fb; --panel:#fff; --text:#17202a; --muted:#5f6b7a; --line:#d8dee8; --accent:#0f766e; --danger:#b42318; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
      header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 28px; border-bottom:1px solid var(--line); background:var(--panel); }
      main { width:min(1180px, calc(100vw - 32px)); margin:24px auto; }
      h1 { margin:0; font-size:22px; } h2 { margin:0 0 14px; font-size:18px; }
      nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
      button, input, select { height:38px; border-radius:6px; border:1px solid var(--line); font:inherit; }
      input, select { min-width:0; padding:0 10px; background:#fff; }
      button { padding:0 13px; background:#fff; cursor:pointer; }
      button.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
      button.danger { color:var(--danger); }
      .toolbar, .create-row, .pager { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
      .toolbar input { width:220px; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; overflow:auto; }
      .metrics { display:grid; grid-template-columns:repeat(3, minmax(160px, 1fr)); gap:12px; }
      .metric { border:1px solid var(--line); border-radius:8px; padding:14px; background:#fbfcfe; }
      .metric strong { display:block; font-size:26px; }
      table { width:100%; min-width:760px; border-collapse:collapse; }
      th, td { padding:12px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; }
      th { color:var(--muted); font-weight:600; background:#fbfcfe; }
      .status { color:var(--muted); font-size:14px; } .hidden { display:none; } .empty { padding:20px; color:var(--muted); }
      @media (max-width:820px) { header { align-items:flex-start; flex-direction:column; } .metrics { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Insighta Labs</h1><div id="session" class="status">Checking session...</div></div>
      <div><a id="login" href="#"><button class="primary">Continue with GitHub</button></a><button id="logout" class="hidden">Sign out</button></div>
    </header>

    <main id="app" class="hidden">
      <nav>
        <button data-view="dashboard">Dashboard</button>
        <button data-view="profiles">Profiles</button>
        <button data-view="search">Search</button>
        <button data-view="account">Account</button>
      </nav>

      <section id="dashboard" class="panel view">
        <h2>Dashboard</h2>
        <div class="metrics">
          <div class="metric"><span class="status">Total profiles</span><strong id="metricTotal">0</strong></div>
          <div class="metric"><span class="status">Current role</span><strong id="metricRole">-</strong></div>
          <div class="metric"><span class="status">Page size</span><strong id="metricLimit">10</strong></div>
        </div>
      </section>

      <section id="profiles" class="view hidden">
        <div id="adminTools" class="create-row hidden"><input id="newName" placeholder="Harriet Tubman" /><button id="create" class="primary">Create</button></div>
        <div class="toolbar panel">
          <select id="gender"><option value="">Any gender</option><option value="male">Male</option><option value="female">Female</option></select>
          <input id="country" placeholder="Country code" maxlength="2" />
          <select id="ageGroup"><option value="">Any age group</option><option>child</option><option>teenager</option><option>adult</option><option>senior</option></select>
          <input id="minAge" placeholder="Min age" type="number" />
          <input id="maxAge" placeholder="Max age" type="number" />
          <select id="limit"><option>10</option><option>20</option><option>50</option></select>
          <button id="applyFilters">Apply</button><button id="export">Export CSV</button>
        </div>
        <div class="panel"><table><thead><tr><th>Name</th><th>Gender</th><th>Age</th><th>Group</th><th>Country</th><th>Created</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No profiles found.</div></div>
        <div class="pager"><button id="prev">Prev</button><span id="meta" class="status"></span><button id="next">Next</button></div>
      </section>

      <section id="detail" class="panel view hidden"><h2>Profile detail</h2><pre id="detailJson"></pre></section>
      <section id="search" class="panel view hidden"><h2>Search</h2><div class="toolbar"><input id="q" placeholder="young males from nigeria" /><button id="searchBtn">Search</button></div><div id="searchResults"></div></section>
      <section id="account" class="panel view hidden"><h2>Account</h2><pre id="accountJson"></pre></section>
    </main>

    <script>
      const urlParams = new URLSearchParams(location.search);
      const configuredApi = urlParams.get("api") || localStorage.getItem("INSIGHTA_API_URL") || "https://backendhng-production.up.railway.app";
      if (urlParams.get("api")) localStorage.setItem("INSIGHTA_API_URL", urlParams.get("api"));
      const API_BASE = configuredApi.replace(/\/$/, "");
      const state = { user:null, page:1, total_pages:1 };
      document.getElementById("login").href = `${API_BASE}/auth/github`;
      const csrf = () => document.cookie.split("; ").find((part) => part.startsWith("insighta_csrf="))?.split("=")[1] || "";

      async function api(path, options = {}, retry = true) {
        const response = await fetch(`${API_BASE}${path}`, {
          credentials:"include",
          headers:{ Accept:"application/json", "X-API-Version":"1", ...(options.body ? { "Content-Type":"application/json", "X-CSRF-Token":csrf() } : {}), ...(options.headers || {}) },
          ...options,
        });
        if (response.status === 401 && retry) {
          const refreshed = await fetch(`${API_BASE}/auth/refresh`, { method:"POST", credentials:"include" }).catch(() => null);
          if (refreshed && refreshed.ok) return api(path, options, false);
        }
        if (!response.ok) throw new Error((await response.json().catch(() => ({ message:"Request failed" }))).message);
        if (response.status === 204) return null;
        return response.json();
      }

      function show(view) { document.querySelectorAll(".view").forEach((el) => el.classList.add("hidden")); document.getElementById(view).classList.remove("hidden"); }
      function paramsFromFilters() {
        const params = new URLSearchParams({ page:state.page, limit:document.getElementById("limit").value });
        const fields = [["gender","gender"],["country","country_id"],["ageGroup","age_group"],["minAge","min_age"],["maxAge","max_age"]];
        for (const [id, key] of fields) { const value = document.getElementById(id).value.trim(); if (value) params.set(key, key === "country_id" ? value.toUpperCase() : value); }
        return params;
      }
      async function loadSession() {
        try {
          const data = await api("/api/profiles?limit=1").catch(async () => api("/api/v1/session/me"));
          const me = await api("/api/v1/session/me");
          state.user = me.data.user;
          document.getElementById("session").textContent = `${state.user.login} (${state.user.role})`;
          document.getElementById("accountJson").textContent = JSON.stringify(state.user, null, 2);
          document.getElementById("metricRole").textContent = state.user.role;
          document.getElementById("login").classList.add("hidden"); document.getElementById("logout").classList.remove("hidden"); document.getElementById("app").classList.remove("hidden");
          if (state.user.role === "admin") document.getElementById("adminTools").classList.remove("hidden");
          await loadProfiles(); show("dashboard");
        } catch { document.getElementById("session").textContent = "Not signed in"; }
      }
      async function loadProfiles() {
        const data = await api(`/api/v1/profiles?${paramsFromFilters().toString()}`);
        state.total_pages = data.total_pages || 1; renderRows(data.data); document.getElementById("metricTotal").textContent = data.total; document.getElementById("metricLimit").textContent = data.limit; document.getElementById("meta").textContent = `Page ${data.page} of ${Math.max(data.total_pages, 1)} - ${data.total} total`;
      }
      function renderRows(rows) {
        const tbody = document.getElementById("rows"); tbody.innerHTML = ""; document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
        for (const row of rows) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td><button data-view-id="${row.id}">${row.name}</button></td><td>${row.gender}</td><td>${row.age}</td><td>${row.age_group}</td><td>${row.country_id || ""}</td><td>${new Date(row.created_at).toLocaleString()}</td><td>${state.user.role === "admin" ? `<button class="danger" data-delete="${row.id}">Delete</button>` : ""}</td>`;
          tbody.appendChild(tr);
        }
      }
      document.querySelector("nav").addEventListener("click", (event) => { if (event.target.dataset.view) show(event.target.dataset.view); });
      document.getElementById("applyFilters").onclick = () => { state.page = 1; loadProfiles().catch((e) => alert(e.message)); };
      document.getElementById("prev").onclick = () => { if (state.page > 1) { state.page -= 1; loadProfiles(); } };
      document.getElementById("next").onclick = () => { if (state.page < state.total_pages) { state.page += 1; loadProfiles(); } };
      document.getElementById("create").onclick = async () => { const name = document.getElementById("newName").value.trim(); if (!name) return; await api("/api/v1/profiles", { method:"POST", body:JSON.stringify({ name }) }); document.getElementById("newName").value = ""; await loadProfiles(); };
      document.getElementById("rows").onclick = async (event) => { const id = event.target.dataset.viewId || event.target.dataset.delete; if (!id) return; if (event.target.dataset.delete) { await api(`/api/v1/profiles/${id}`, { method:"DELETE", body:"{}" }); await loadProfiles(); return; } const data = await api(`/api/v1/profiles/${id}`); document.getElementById("detailJson").textContent = JSON.stringify(data.data, null, 2); show("detail"); };
      document.getElementById("searchBtn").onclick = async () => { const q = document.getElementById("q").value.trim(); if (!q) return; const data = await api(`/api/v1/profiles/search?q=${encodeURIComponent(q)}`); document.getElementById("searchResults").innerHTML = `<pre>${JSON.stringify(data.data, null, 2)}</pre>`; };
      document.getElementById("export").onclick = async () => { const response = await fetch(`${API_BASE}/api/v1/profiles/export?${paramsFromFilters().toString()}&format=csv`, { credentials:"include", headers:{ "X-API-Version":"1" } }); const blob = await response.blob(); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `profiles_${new Date().toISOString().replace(/[:.]/g, "-")}.csv`; link.click(); URL.revokeObjectURL(link.href); };
      document.getElementById("logout").onclick = async () => { await fetch(`${API_BASE}/auth/logout`, { method:"POST", credentials:"include", headers:{ "X-CSRF-Token":csrf() } }); location.href = "/"; };
      loadSession();
    </script>
  </body>
</html>
